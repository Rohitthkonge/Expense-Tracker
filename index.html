<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your spending, category by category</p>
    </header>

    <section class="summary">
      <div class="summary-card income">
        <span>Total Income</span>
        <h2 id="totalIncome">₹0</h2>
      </div>
      <div class="summary-card expense">
        <span>Total Expense</span>
        <h2 id="totalExpense">₹0</h2>
      </div>
      <div class="summary-card balance">
        <span>Balance</span>
        <h2 id="balance">₹0</h2>
      </div>
    </section>

    <section class="main-grid">
      <div class="card form-card">
        <h3>Add Transaction</h3>
        <form id="transactionForm">
          <input type="text" id="description" placeholder="Description" required>
          <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <input type="date" id="date" required>
          <button type="submit">Add Transaction</button>
        </form>
      </div>

      <div class="card chart-card">
        <h3>Spending by Category</h3>
        <canvas id="categoryChart"></canvas>
        <p id="noDataMsg" class="no-data">No expenses yet</p>
      </div>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h3>Transactions</h3>
        <button id="clearAll" class="clear-btn">Clear All</button>
      </div>
      <ul id="transactionList"></ul>
      <p id="emptyMsg" class="no-data">No transactions yet. Add one above.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
